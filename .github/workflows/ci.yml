name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '11.0'
  RUST_BACKTRACE: '1'

jobs:
  check:
    # GitHub's standard macos-15 runner is Apple silicon (ARM64).
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify runner and install Rust
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --target aarch64-apple-darwin
          rustc +1.98.0 --version

      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check

      - name: Check all targets
        run: cargo +1.98.0 check --locked --all-targets --target aarch64-apple-darwin

      - name: Test
        run: cargo +1.98.0 test --locked --target aarch64-apple-darwin

      - name: Clippy
        run: cargo +1.98.0 clippy --locked --all-targets --target aarch64-apple-darwin -- -D warnings

      - name: Check packaging script syntax
        run: /bin/bash -n scripts/package-release.sh

      - name: Test Skill installer
        run: /bin/bash tests/install.sh

      - name: Build release binary
        run: cargo +1.98.0 build --release --locked --target aarch64-apple-darwin

      - name: Verify release packaging
        run: /bin/bash tests/package-release.sh
